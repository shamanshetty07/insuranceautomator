[project]
name = "vehicle-damage-backend"
version = "0.1.0"
description = "Backend API for AI-powered vehicle damage assessment (Phase 1 foundation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pillow>=11,<13",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
# Local YOLO inference. AGPL-3.0 licensed; pulls in torch (~1.2 GB installed).
# Verified on Python 3.14.2 / macOS arm64 with torch 2.15.0 (CPU).
detection = [
    "ultralytics==8.4.191",
]
# Local Qwen-VL inference (app.services.vlm). Not installed or run in this repo yet;
# API checked against the transformers 5.15.1 source. Needs torch (CPU/MPS) and a local
# safetensors snapshot of e.g. Qwen2-VL-2B-Instruct (Apache-2.0; ~4.5 GB in bf16).
vlm = [
    "transformers==5.15.1",
    "torch>=2.6",
]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
